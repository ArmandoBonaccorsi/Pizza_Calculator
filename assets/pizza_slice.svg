# pizza_slice.svg
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="cheese" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#ffe79a"/>
      <stop offset="100%" stop-color="#f4c655"/>
    </radialGradient>
    <linearGradient id="crust" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d89a52"/>
      <stop offset="100%" stop-color="#ad6f2e"/>
    </linearGradient>
    <linearGradient id="tomato" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d42c1f"/>
      <stop offset="100%" stop-color="#b71c10"/>
    </linearGradient>
  </defs>

  <!-- Crust -->
  <path d="M50 60 Q260 220 470 60 Q455 120 430 170 Q300 420 210 420 Q140 420 80 300 Q55 240 50 60Z"
        fill="url(#crust)" stroke="#8b4e1d" stroke-width="6"/>

  <!-- Cheese layer -->
  <path d="M85 95 Q260 235 435 95 Q420 140 395 190 Q290 390 215 390 Q150 390 110 300 Q90 250 85 95Z"
        fill="url(#cheese)" stroke="#d9a842" stroke-width="4"/>

  <!-- Tomato sauce stains -->
  <circle cx="200" cy="180" r="28" fill="url(#tomato)"/>
  <circle cx="300" cy="240" r="22" fill="url(#tomato)"/>
  <circle cx="240" cy="300" r="26" fill="url(#tomato)"/>

  <!-- Pepperoni slices -->
  <circle cx="180" cy="260" r="38" fill="#b92b1c" stroke="#7a0f0b" stroke-width="6"/>
  <circle cx="270" cy="180" r="34" fill="#b92b1c" stroke="#7a0f0b" stroke-width="6"/>
  <circle cx="330" cy="290" r="36" fill="#b92b1c" stroke="#7a0f0b" stroke-width="6"/>

  <!-- Shine on cheese -->
  <path d="M130 150 Q260 220 390 150" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="12"/>

</svg>
